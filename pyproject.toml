[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-ai-eval-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "deepeval>=3.8",
  "ragas>=0.3",
  "langsmith>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["goldens*", "tests*", "reports*", "baseline*"]
